name: Public OCI release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

concurrency:
  group: public-oci-release-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/ashergarland/agent-tool-server-azure
  NODE_VERSION: '22'
  REGISTRY: ghcr.io

jobs:
  validate:
    name: Validate tagged source
    runs-on: ubuntu-latest
    permissions:
      actions: read # Query the full CI result for the exact tagged commit.
      contents: read
    outputs:
      ci_run_url: ${{ steps.ci.outputs.ci_run_url }}
      git_sha: ${{ steps.contract.outputs.git_sha }}
      source_date_epoch: ${{ steps.contract.outputs.source_date_epoch }}
      source_tag: ${{ steps.contract.outputs.source_tag }}
      version: ${{ steps.contract.outputs.version }}
    steps:
      - name: Check out the exact tag target
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: Validate tag, versions, and source identity
        id: contract
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$GITHUB_REPOSITORY" != 'ashergarland/agent-tool-server-azure' ]]; then
            echo "::error::This workflow may publish only from ashergarland/agent-tool-server-azure."
            exit 1
          fi
          if [[ "$GITHUB_REF_TYPE" != 'tag' || "$GITHUB_REF" != "refs/tags/$RELEASE_TAG" ]]; then
            echo "::error::The release source is not the expected tag ref."
            exit 1
          fi

          version="$(node scripts/validate-release.mjs "$RELEASE_TAG")"
          git_sha="$(git rev-parse HEAD)"
          source_date_epoch="$(git show -s --format=%ct HEAD)"
          event_sha="$(git rev-parse --verify "${GITHUB_SHA}^{commit}")"
          tag_sha="$(git rev-parse --verify "refs/tags/${RELEASE_TAG}^{commit}")"

          if [[ ! "$git_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::The checked-out source did not resolve to a full Git commit SHA."
            exit 1
          fi
          if [[ ! "$source_date_epoch" =~ ^[0-9]+$ ]]; then
            echo "::error::The tagged source commit has no valid Unix timestamp."
            exit 1
          fi
          if [[ "$git_sha" != "$event_sha" ]]; then
            echo "::error::The checkout and event SHA do not identify one commit."
            exit 1
          fi
          if [[ "$git_sha" != "$tag_sha" ]]; then
            echo "::error::The checkout and tag target do not identify one commit."
            exit 1
          fi
          if ! git merge-base --is-ancestor "$git_sha" origin/main; then
            echo "::error::The tagged commit is not integrated into origin/main."
            exit 1
          fi
          if [[ -n "$(git status --porcelain)" ]]; then
            echo "::error::The tagged source checkout is not clean."
            git status --short
            exit 1
          fi

          {
            echo "git_sha=$git_sha"
            echo "source_date_epoch=$source_date_epoch"
            echo "source_tag=sha-${git_sha:0:12}"
            echo "version=$version"
          } >> "$GITHUB_OUTPUT"

      - name: Install exact dependencies
        run: npm ci

      - name: Validate generated API and server metadata
        run: |
          npm run openapi:emit -- "$RUNNER_TEMP/openapi.json"
          npm run openapi:check -- "$RUNNER_TEMP/openapi.json"
          npm run metadata:validate

      - name: Require successful main CI for the exact commit
        id: ci
        env:
          GH_TOKEN: ${{ github.token }}
          GIT_SHA: ${{ steps.contract.outputs.git_sha }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail

          release_error="$(mktemp)"
          if gh api \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2026-03-10' \
            "/repos/ashergarland/agent-tool-server-azure/releases/tags/${RELEASE_TAG}" \
            > /dev/null 2> "$release_error"; then
            echo "::error::GitHub Release $RELEASE_TAG already exists; refusing to republish it."
            rm -f "$release_error"
            exit 1
          fi
          if ! grep -Fq 'HTTP 404' "$release_error"; then
            cat "$release_error" >&2
            rm -f "$release_error"
            exit 1
          fi
          rm -f "$release_error"

          response="$(
            gh api --paginate --slurp \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2026-03-10' \
              "/repos/ashergarland/agent-tool-server-azure/actions/workflows/ci.yml/runs?head_sha=${GIT_SHA}&event=push&status=completed&per_page=100"
          )"
          selection="$(
            jq -cer --arg sha "$GIT_SHA" '
              [
                .[].workflow_runs[]
                | select(
                    .head_sha == $sha
                    and .head_branch == "main"
                    and .event == "push"
                    and .status == "completed"
                    and .conclusion == "success"
                  )
              ] as $matches
              | if ($matches | length) == 0 then
                  empty
                else
                  {
                    count: ($matches | length),
                    run: ($matches | sort_by(.run_number) | last)
                  }
                end
            ' <<< "$response"
          )" || {
            echo "::error::No successful completed main CI run exists for $GIT_SHA."
            exit 1
          }

          ci_run_url="$(jq -r '.run.html_url' <<< "$selection")"
          matching_runs="$(jq -r '.count' <<< "$selection")"
          echo "ci_run_url=$ci_run_url" >> "$GITHUB_OUTPUT"
          echo "Exact-source CI: selected latest of $matching_runs matching run(s): $ci_run_url"

  publish:
    name: Publish and verify public OCI release
    needs: validate
    runs-on: ubuntu-latest
    env:
      VALIDATION_TAG: release-validation-${{ github.run_id }}-${{ github.run_attempt }}
    permissions:
      artifact-metadata: write # Record the attested OCI artifact.
      attestations: write # Persist GitHub build provenance.
      contents: read
      id-token: write # Mint the short-lived Sigstore identity.
      packages: write # Publish the image and registry attestation.
    outputs:
      digest: ${{ steps.candidate.outputs.digest }}
    steps:
      - name: Check out the validated source commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ needs.validate.outputs.git_sha }}

      - name: Verify the release tag still identifies the validated source
        env:
          GIT_SHA: ${{ needs.validate.outputs.git_sha }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail

          tag_sha="$(git rev-parse --verify "refs/tags/${RELEASE_TAG}^{commit}")"
          if [[ "$tag_sha" != "$GIT_SHA" ]]; then
            echo "::error::The release tag moved after source validation."
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          password: ${{ secrets.GITHUB_TOKEN }}
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}

      - name: Fresh-build and push the validation manifest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        env:
          SOURCE_DATE_EPOCH: ${{ needs.validate.outputs.source_date_epoch }}
        with:
          build-args: |
            GIT_SHA=${{ needs.validate.outputs.git_sha }}
            SERVICE_VERSION=${{ needs.validate.outputs.version }}
          context: .
          no-cache: true
          provenance: false
          push: true
          tags: ${{ env.IMAGE_NAME }}:${{ env.VALIDATION_TAG }}

      - name: Establish the authoritative candidate registry digest
        id: candidate
        env:
          BUILD_DIGEST: ${{ steps.build.outputs.digest }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! "$BUILD_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::Buildx returned an invalid candidate manifest digest: $BUILD_DIGEST"
            exit 1
          fi

          validation_ref="$IMAGE_NAME:$VALIDATION_TAG"
          registry_digest="$(
            docker buildx imagetools inspect "$validation_ref" \
              --format '{{ .Manifest.Digest }}'
          )"
          if [[ "$registry_digest" != "$BUILD_DIGEST" ]]; then
            echo "::error::Registry validation tag resolves to $registry_digest, not $BUILD_DIGEST."
            exit 1
          fi

          docker pull "$IMAGE_NAME@$registry_digest"
          echo "digest=$registry_digest" >> "$GITHUB_OUTPUT"
          echo "Fresh exact-source candidate: $IMAGE_NAME@$registry_digest"

      - name: Verify image identity and non-root runtime
        env:
          CANDIDATE_DIGEST: ${{ steps.candidate.outputs.digest }}
          GIT_SHA: ${{ needs.validate.outputs.git_sha }}
          VERSION: ${{ needs.validate.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          image="$IMAGE_NAME@$CANDIDATE_DIGEST"
          revision="$(
            docker image inspect \
              --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' \
              "$image"
          )"
          image_version="$(
            docker image inspect \
              --format '{{ index .Config.Labels "org.opencontainers.image.version" }}' \
              "$image"
          )"
          source="$(
            docker image inspect \
              --format '{{ index .Config.Labels "org.opencontainers.image.source" }}' \
              "$image"
          )"
          uid="$(docker run --rm --entrypoint id "$image" -u)"

          [[ "$revision" == "$GIT_SHA" ]]
          [[ "$image_version" == "$VERSION" ]]
          [[ "$source" == 'https://github.com/ashergarland/agent-tool-server-azure' ]]
          [[ "$uid" != '0' ]]
          docker image inspect --format '{{ range .Config.Env }}{{ println . }}{{ end }}' \
            "$image" | grep -Fx "GIT_SHA=$GIT_SHA"
          docker image inspect --format '{{ range .Config.Env }}{{ println . }}{{ end }}' \
            "$image" | grep -Fx "SERVICE_VERSION=$VERSION"

      - name: Verify the stdio MCP entry point
        env:
          CANDIDATE_DIGEST: ${{ steps.candidate.outputs.digest }}
        shell: bash
        run: |
          set -euo pipefail

          image="$IMAGE_NAME@$CANDIDATE_DIGEST"
          printf '%s\n%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"release","version":"1"}}}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/list","params":{}}' \
            | docker run --rm -i \
                -e NODE_ENV=development -e AUTH_MODE=disabled -e LOG_LEVEL=silent \
                --entrypoint node "$image" dist/stdio.js \
            | tee "$RUNNER_TEMP/release-mcp.jsonl"
          grep -q 'azure_list_subscriptions' "$RUNNER_TEMP/release-mcp.jsonl"
          grep -q 'azure_validate_bicep' "$RUNNER_TEMP/release-mcp.jsonl"

      - name: Verify HTTP and protected surfaces
        env:
          CANDIDATE_DIGEST: ${{ steps.candidate.outputs.digest }}
          GIT_SHA: ${{ needs.validate.outputs.git_sha }}
          VERSION: ${{ needs.validate.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          api_key="$(openssl rand -hex 32)"
          container_name="azure-release-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          image="$IMAGE_NAME@$CANDIDATE_DIGEST"
          cleanup() {
            status=$?
            trap - EXIT
            if docker container inspect "$container_name" > /dev/null 2>&1; then
              if [[ "$status" -ne 0 ]]; then
                docker logs "$container_name" >&2 || true
              fi
              docker rm -f "$container_name" > /dev/null || true
            fi
            exit "$status"
          }
          trap cleanup EXIT

          docker run -d --name "$container_name" -p 127.0.0.1:8080:8080 \
            -e API_KEYS="$api_key" \
            "$image"

          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/health > /dev/null; then
              break
            fi
            sleep 1
          done

          curl -fsS http://127.0.0.1:8080/health
          version_body="$(curl -fsS http://127.0.0.1:8080/version)"
          jq -e --arg sha "$GIT_SHA" --arg version "$VERSION" \
            '.gitSha == $sha and .version == $version' <<< "$version_body"
          curl -fsS -H "x-api-key: $api_key" http://127.0.0.1:8080/tools > /dev/null
          [[ "$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/tools)" == '401' ]]
          [[ "$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/mcp)" == '401' ]]
          [[ "$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/metrics)" == '401' ]]

          docker logs "$container_name" 2>&1 | tee "$RUNNER_TEMP/release-server.log"
          if grep -Fq "$api_key" "$RUNNER_TEMP/release-server.log"; then
            echo "::error::The HTTP authentication key appeared in container logs."
            exit 1
          fi

      - name: Compare existing release tags with the fresh build
        env:
          CANDIDATE_DIGEST: ${{ steps.candidate.outputs.digest }}
          SOURCE_TAG: ${{ needs.validate.outputs.source_tag }}
          VERSION: ${{ needs.validate.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          resolve_digest() {
            local ref="$1"
            local error_file
            error_file="$(mktemp)"
            if docker buildx imagetools inspect "$ref" \
              --format '{{ .Manifest.Digest }}' 2> "$error_file"; then
              rm -f "$error_file"
              return 0
            fi
            if grep -Eqi 'manifest unknown|not found' "$error_file"; then
              rm -f "$error_file"
              return 2
            fi
            cat "$error_file" >&2
            rm -f "$error_file"
            return 1
          }

          read_existing_digest() {
            local tag="$1"
            local digest
            if digest="$(resolve_digest "$IMAGE_NAME:$tag")"; then
              printf '%s' "$digest"
              return 0
            else
              local status=$?
            fi
            if [[ "$status" -eq 2 ]]; then
              return 0
            fi
            return "$status"
          }

          source_digest="$(read_existing_digest "$SOURCE_TAG")"
          canonical_digest="$(read_existing_digest "$VERSION")"
          version_alias_digest="$(read_existing_digest "v$VERSION")"

          state_file="$RUNNER_TEMP/preexisting-release-state.json"
          jq -n \
            --arg candidate "$CANDIDATE_DIGEST" \
            --arg version "$VERSION" \
            --arg sourceTag "$SOURCE_TAG" \
            --arg sourceDigest "$source_digest" \
            --arg canonicalDigest "$canonical_digest" \
            --arg versionAliasDigest "$version_alias_digest" '
              def nullable: if . == "" then null else . end;
              {
                candidateDigest: $candidate,
                version: $version,
                sourceTag: $sourceTag,
                requireAll: false,
                digests: {
                  source: ($sourceDigest | nullable),
                  canonical: ($canonicalDigest | nullable),
                  versionAlias: ($versionAliasDigest | nullable)
                }
              }
            ' > "$state_file"

          node scripts/release-integrity.mjs "$state_file" \
            | tee "$RUNNER_TEMP/preexisting-release-result.json"

      - name: Establish or reuse the immutable source tag
        env:
          CANDIDATE_DIGEST: ${{ steps.candidate.outputs.digest }}
          SOURCE_TAG: ${{ needs.validate.outputs.source_tag }}
        shell: bash
        run: |
          set -euo pipefail

          source_ref="$IMAGE_NAME:$SOURCE_TAG"
          error_file="$(mktemp)"
          if observed="$(
            docker buildx imagetools inspect "$source_ref" \
              --format '{{ .Manifest.Digest }}' 2> "$error_file"
          )"; then
            rm -f "$error_file"
            if [[ "$observed" != "$CANDIDATE_DIGEST" ]]; then
              echo "::error::$source_ref changed to $observed after integrity validation."
              exit 1
            fi
            echo "Reusing $source_ref at $observed"
          elif grep -Eqi 'manifest unknown|not found' "$error_file"; then
            rm -f "$error_file"
            docker buildx imagetools create \
              --prefer-index=false \
              --tag "$source_ref" \
              "$IMAGE_NAME@$CANDIDATE_DIGEST"
          else
            cat "$error_file" >&2
            rm -f "$error_file"
            exit 1
          fi

          observed="$(
            docker buildx imagetools inspect "$source_ref" \
              --format '{{ .Manifest.Digest }}'
          )"
          if [[ "$observed" != "$CANDIDATE_DIGEST" ]]; then
            echo "::error::$source_ref resolves to $observed, not $CANDIDATE_DIGEST."
            exit 1
          fi

      - name: Require anonymous public pull
        env:
          CANDIDATE_DIGEST: ${{ steps.candidate.outputs.digest }}
        shell: bash
        run: |
          set -euo pipefail

          anonymous_config="$(mktemp -d)"
          trap 'rm -rf "$anonymous_config"' EXIT
          public_digest="$(
            DOCKER_CONFIG="$anonymous_config" docker buildx imagetools inspect \
              "$IMAGE_NAME@$CANDIDATE_DIGEST" \
              --format '{{ .Manifest.Digest }}'
          )"
          [[ "$public_digest" == "$CANDIDATE_DIGEST" ]]
          DOCKER_CONFIG="$anonymous_config" docker pull "$IMAGE_NAME@$CANDIDATE_DIGEST"

      - name: Establish or reuse version aliases
        env:
          CANDIDATE_DIGEST: ${{ steps.candidate.outputs.digest }}
          VERSION: ${{ needs.validate.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          resolve_digest() {
            local ref="$1"
            local error_file
            error_file="$(mktemp)"
            if docker buildx imagetools inspect "$ref" \
              --format '{{ .Manifest.Digest }}' 2> "$error_file"; then
              rm -f "$error_file"
              return 0
            fi
            if grep -Eqi 'manifest unknown|not found' "$error_file"; then
              rm -f "$error_file"
              return 2
            fi
            cat "$error_file" >&2
            rm -f "$error_file"
            return 1
          }

          for tag in "$VERSION" "v$VERSION"; do
            ref="$IMAGE_NAME:$tag"
            if observed="$(resolve_digest "$ref")"; then
              if [[ "$observed" != "$CANDIDATE_DIGEST" ]]; then
                echo "::error::$ref changed to $observed after integrity validation."
                exit 1
              fi
              echo "Reusing $ref at $observed"
            else
              status=$?
              if [[ "$status" -ne 2 ]]; then
                exit "$status"
              fi
              docker buildx imagetools create \
                --prefer-index=false \
                --tag "$ref" \
                "$IMAGE_NAME@$CANDIDATE_DIGEST"
            fi
          done

      - name: Verify every release alias against the fresh build
        env:
          CANDIDATE_DIGEST: ${{ steps.candidate.outputs.digest }}
          SOURCE_TAG: ${{ needs.validate.outputs.source_tag }}
          VERSION: ${{ needs.validate.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          source_digest="$(
            docker buildx imagetools inspect "$IMAGE_NAME:$SOURCE_TAG" \
              --format '{{ .Manifest.Digest }}'
          )"
          canonical_digest="$(
            docker buildx imagetools inspect "$IMAGE_NAME:$VERSION" \
              --format '{{ .Manifest.Digest }}'
          )"
          version_alias_digest="$(
            docker buildx imagetools inspect "$IMAGE_NAME:v$VERSION" \
              --format '{{ .Manifest.Digest }}'
          )"

          state_file="$RUNNER_TEMP/final-release-state.json"
          jq -n \
            --arg candidate "$CANDIDATE_DIGEST" \
            --arg version "$VERSION" \
            --arg sourceTag "$SOURCE_TAG" \
            --arg sourceDigest "$source_digest" \
            --arg canonicalDigest "$canonical_digest" \
            --arg versionAliasDigest "$version_alias_digest" '
              {
                candidateDigest: $candidate,
                version: $version,
                sourceTag: $sourceTag,
                requireAll: true,
                digests: {
                  source: $sourceDigest,
                  canonical: $canonicalDigest,
                  versionAlias: $versionAliasDigest
                }
              }
            ' > "$state_file"

          node scripts/release-integrity.mjs "$state_file" \
            | tee "$RUNNER_TEMP/final-release-result.json"

          anonymous_config="$(mktemp -d)"
          trap 'rm -rf "$anonymous_config"' EXIT
          version_digest="$(
            DOCKER_CONFIG="$anonymous_config" docker buildx imagetools inspect \
              "$IMAGE_NAME:$VERSION" \
              --format '{{ .Manifest.Digest }}'
          )"
          [[ "$version_digest" == "$CANDIDATE_DIGEST" ]]
          DOCKER_CONFIG="$anonymous_config" docker pull "$IMAGE_NAME:$VERSION"

      - name: Attest published image provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          push-to-registry: true
          subject-digest: ${{ steps.candidate.outputs.digest }}
          subject-name: ${{ env.IMAGE_NAME }}

  release:
    name: Create GitHub Release
    needs: [validate, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write # Create the GitHub Release after OCI verification.
    steps:
      - name: Check out the released source commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ needs.validate.outputs.git_sha }}

      - name: Verify the release tag still identifies the published source
        env:
          GIT_SHA: ${{ needs.validate.outputs.git_sha }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail

          tag_sha="$(git rev-parse --verify "refs/tags/${RELEASE_TAG}^{commit}")"
          if [[ "$tag_sha" != "$GIT_SHA" ]]; then
            echo "::error::The release tag moved after OCI publication."
            exit 1
          fi

      - name: Create GitHub Release
        env:
          CI_RUN_URL: ${{ needs.validate.outputs.ci_run_url }}
          DIGEST: ${{ needs.publish.outputs.digest }}
          GH_TOKEN: ${{ github.token }}
          GIT_SHA: ${{ needs.validate.outputs.git_sha }}
          RELEASE_TAG: ${{ github.ref_name }}
          SOURCE_TAG: ${{ needs.validate.outputs.source_tag }}
          VERSION: ${{ needs.validate.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::The publish job did not return a valid manifest digest."
            exit 1
          fi

          release_error="$(mktemp)"
          if gh api \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2026-03-10' \
            "/repos/ashergarland/agent-tool-server-azure/releases/tags/${RELEASE_TAG}" \
            > /dev/null 2> "$release_error"; then
            echo "::error::GitHub Release $RELEASE_TAG already exists; refusing to replace it."
            rm -f "$release_error"
            exit 1
          fi
          if ! grep -Fq 'HTTP 404' "$release_error"; then
            cat "$release_error" >&2
            rm -f "$release_error"
            exit 1
          fi
          rm -f "$release_error"

          notes="$RUNNER_TEMP/release-notes.md"
          cat > "$notes" <<EOF
          Public Azure capability release.

          - Version: \`$VERSION\`
          - Source commit: \`$GIT_SHA\`
          - OCI artifact: \`$IMAGE_NAME:$VERSION\`
          - Immutable source tag: \`$IMAGE_NAME:$SOURCE_TAG\`
          - Manifest digest: \`$DIGEST\`
          - Exact-source CI: $CI_RUN_URL
          EOF

          gh release create "$RELEASE_TAG" \
            --repo ashergarland/agent-tool-server-azure \
            --verify-tag \
            --target "$GIT_SHA" \
            --title "Azure capability $VERSION" \
            --notes-file "$notes"

          {
            echo "## Public OCI release"
            echo
            echo "- Version: \`$VERSION\`"
            echo "- Source: \`$GIT_SHA\`"
            echo "- OCI: \`$IMAGE_NAME:$VERSION\`"
            echo "- Digest: \`$DIGEST\`"
          } >> "$GITHUB_STEP_SUMMARY"
